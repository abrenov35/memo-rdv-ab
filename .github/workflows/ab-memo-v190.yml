name: AB Memo V1.9.0
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V1.9.0 UX
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          # Version
          s=s.replace('V1.8.0','V1.9.0')
          # More breathing room for fixed action dock
          s=s.replace('.wrap{max-width:760px;margin:auto;padding:14px 12px 100px}', '.wrap{max-width:760px;margin:auto;padding:14px 12px 168px}')
          # Bottom control dock: talk large + photo right
          s=re.sub(r'\.actions\{[^}]*\}', '.actions{position:fixed;z-index:30;left:0;right:0;bottom:0;display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));margin:0;background:#f3f6f9f2;backdrop-filter:blur(12px);border-top:1px solid #d8e1ea;box-shadow:0 -8px 30px #082a5217}', s, count=1)
          s=re.sub(r'\.talk\{[^}]*\}', '.talk{min-height:66px;background:var(--n);color:#fff;font-size:16px;user-select:none;-webkit-user-select:none;border-radius:18px;box-shadow:0 8px 20px #082a5226}', s, count=1)
          s=s.replace('.talk span{display:block;font-size:27px;margin-bottom:5px}', '.talk span{display:inline-block;font-size:23px;margin-right:8px;vertical-align:-2px}')
          s=re.sub(r'\.talk\.live\{[^}]*\}', '.talk.live{background:var(--r);transform:scale(.99);box-shadow:0 0 0 5px #cf30381c,0 8px 22px #cf30382d}', s, count=1)
          s=re.sub(r'\.photo\{[^}]*\}', '.photo{min-height:66px;background:#fff;border:1px solid var(--l);font-size:13px;border-radius:18px;box-shadow:0 7px 18px #082a5212}', s, count=1)
          s=s.replace('.photo span{display:block;font-size:25px}', '.photo span{display:block;font-size:23px;margin-bottom:2px}')
          # Finish button moves back into content, clearly separated from the recording dock
          s=re.sub(r'\.finish\{[^}]*\}', '.finish{position:static;margin-top:14px;padding:0 0 8px;background:transparent}', s, count=1)
          s=s.replace('.finish button{min-height:58px;font-size:17px}', '.finish button{min-height:58px;font-size:17px;margin-bottom:8px}')
          # Toast above dock
          s=re.sub(r'\.toast\{([^}]*)bottom:82px;', lambda m: '.toast{'+m.group(1)+'bottom:100px;', s, count=1)
          # Stronger copy
          s=s.replace('Maintenez le bouton rouge/bleu pour dicter.', 'Maintenez le bouton en bas pour parler. Relâchez : le micro s’arrête.')
          s=s.replace('MAINTENIR POUR PARLER', 'MAINTENIR POUR DICTER')
          # Add a small explicit control hint above transcript
          s=s.replace('<div class="title">Transcription</div><div id="journal"', '<div class="title">Transcription</div><div class="mut" style="margin:-4px 0 8px">Le texte apparaît pendant la dictée. Les métrés sont proposés à validation après relâchement.</div><div id="journal"')
          # Improve room detection vocabulary and precision
          s=s.replace("chambre(?:\\s+[\\wà-ÿ'-]+){0,3}|bureau(?:\\s+[\\wà-ÿ'-]+){0,3}|cuisine|salon|séjour|salle de bains?|sdb|wc|couloir|entrée|garage|buanderie|cellier|terrasse", "chambre(?:\\s+(?:bébé|parentale|amis|enfant|[\\wà-ÿ'-]+)){0,3}|bureau(?:\\s+[\\wà-ÿ'-]+){0,3}|cuisine|salon|séjour|salle à manger|salle de bains?|sdb|wc|toilettes?|couloir|entrée|garage|buanderie|cellier|terrasse|dressing|palier|combles?|cave")
          # Replace recognition core with hold-aware, lower-latency version.
          start=s.find('function SR(){')
          end=s.find("$('reload').onclick", start)
          if start!=-1 and end!=-1:
              new=r'''function SR(){return window.SpeechRecognition||window.webkitSpeechRecognition}function ui(on){$('status').textContent=on?'● ENREGISTREMENT EN COURS':'MICRO ARRÊTÉ';$('status').classList.toggle('live',on);$('talk').classList.toggle('live',on);$('talk').innerHTML=on?'<span>🔴</span>PARLEZ — RELÂCHEZ POUR ARRÊTER':'<span>🎙️</span>MAINTENIR POUR DICTER'}function chooseTranscript(res){let best='';for(let j=0;j<res.length;j++){let t=(res[j].transcript||'').trim();if(t.length>best.length)best=t}return best}function stopMain(){S.holding=false;let r=S.rec;S.rec=null;if(r)try{r.stop()}catch{}ui(false)}function startMain(e){if(e){e.preventDefault();try{e.currentTarget.setPointerCapture&&e.currentTarget.setPointerCapture(e.pointerId)}catch{}}if(S.finished||S.rec||S.pendingMeasure)return;S.holding=true;let C=SR();if(!C)return toast('Dictée vocale indisponible');let r=new C;S.rec=r;r.lang='fr-FR';r.interimResults=true;r.continuous=true;r.maxAlternatives=5;let finals=[];r.onstart=()=>{ui(true);$('liveText').textContent='Je vous écoute…'};r.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){let res=e.results[i],t=chooseTranscript(res);if(res.isFinal){if(t)finals.push(t)}else if(t)interim=t}let shown=(finals.join(' ')+' '+interim).trim();if(shown)$('liveText').textContent=shown};r.onend=()=>{if(S.rec===r)S.rec=null;ui(false);let text=finals.join(' ').replace(/\s+/g,' ').trim();if(text){$('liveText').textContent=text;handlePhrase(text)}else if(S.holding&&!S.finished&&!S.pendingMeasure){setTimeout(()=>startMain(),40)}};r.onerror=e=>{if(!['aborted','no-speech'].includes(e.error))toast('Micro : '+e.error);if(S.rec===r)S.rec=null;ui(false)};try{r.start()}catch{S.rec=null;S.holding=false;ui(false)}}function releaseMain(e){if(e)e.preventDefault();S.holding=false;let r=S.rec;if(r)try{r.stop()}catch{}ui(false)}function bindHoldButton(){let old=$('talk'),n=old.cloneNode(true);old.replaceWith(n);['pointerdown'].forEach(ev=>n.addEventListener(ev,startMain,{passive:false}));['pointerup','pointercancel','lostpointercapture'].forEach(ev=>n.addEventListener(ev,releaseMain,{passive:false}));n.addEventListener('contextmenu',e=>e.preventDefault());}setTimeout(bindHoldButton,0);'''
              s=s[:start]+new+s[end:]
          # Remove any later old talk bindings left in the file (common V1.8 patterns)
          s=re.sub(r"\$\('talk'\)\.(?:onpointerdown|onpointerup|onpointercancel|ontouchstart|ontouchend|onmousedown|onmouseup)=[^;]+;",'',s)
          # Safety: ensure state supports holding
          s=s.replace("photoRec:null};", "photoRec:null,holding:false};")
          p.write_text(s)
          PY
          git rm -f .github/workflows/ab-memo-v190.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "V1.9.0: fixed bottom hold-to-talk and photo controls"
          git push
